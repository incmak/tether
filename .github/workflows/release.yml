name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check release version
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python3 -c 'import re; assert re.fullmatch(r"\d+\.\d+\.\d+(?:-rc\.?\d+)?", open("VERSION").read().strip())'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: cd ui && npm ci && npm run build
      - name: Package tagged tree and built UI
        shell: bash
        run: |
          version=$(cat VERSION)
          mkdir package artifacts
          git archive "$GITHUB_REF_NAME" | tar -x -C package
          mkdir -p package/ui/dist
          cp -a ui/dist/. package/ui/dist/
          tar --exclude='./site' -czf "artifacts/tether-$version.tar.gz" -C package .
          (cd artifacts && sha256sum "tether-$version.tar.gz" > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: artifacts/
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: artifacts
      - name: Create tagged release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-rc* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes "${flags[@]}"
