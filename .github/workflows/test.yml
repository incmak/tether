name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # The Python tests load ui/src TypeScript, so install the UI packages first.
      - run: cd ui && npm ci
      - run: cd server && python3 -m unittest discover -q
  ui:
    # Match the OS supported by the pinned Playwright browser/dependency bundle.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd ui && npm ci && npx tsc -b && npx eslint . && npm run build
      - run: cd ui && node run_ui_tests.cjs --unit
  browser:
    # Match the OS supported by the pinned Playwright browser/dependency bundle.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd ui && npm ci && npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/package-lock.json') }}
      - name: Install Chromium system packages
        shell: bash
        run: |
          cd ui
          for attempt in 1 2 3; do
            if npx playwright-core install-deps chromium; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 30
          done
      - name: Install test Chromium
        shell: bash
        run: |
          cd ui
          for attempt in 1 2 3; do
            if npx playwright-core install --only-shell chromium; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 30
          done
      - name: Browser UI tests
        run: cd ui && node run_ui_tests.cjs --browser
      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-browser-screenshots-${{ github.run_attempt }}
          path: .release-work/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
